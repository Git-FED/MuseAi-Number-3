name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        id: project
        shell: bash
        run: |
          if [ -f "$GITHUB_WORKSPACE/settings.gradle" ] || \
             [ -f "$GITHUB_WORKSPACE/settings.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            mapfile -t PROJECT_DIRS < <(
              find "$GITHUB_WORKSPACE" \
                -type d -name .git -prune -o \
                -type f \( \
                  -name settings.gradle \
                  -o -name settings.gradle.kts \
                \) -printf '%h\n' | sort -u
            )

            if [ "${#PROJECT_DIRS[@]}" -eq 0 ]; then
              echo "::error::No Android Gradle project found."
              find "$GITHUB_WORKSPACE" -maxdepth 3 -type f \
                -not -path '*/.git/*'
              exit 1
            fi

            if [ "${#PROJECT_DIRS[@]}" -gt 1 ]; then
              echo "::error::Multiple Gradle projects found. Specify the Android project directory."
              printf '%s\n' "${PROJECT_DIRS[@]}"
              exit 1
            fi

            PROJECT_DIR="${PROJECT_DIRS[0]}"
          fi

          echo "Android project: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Install Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify Gradle version
        shell: bash
        run: |
          echo "Workflow commit: $GITHUB_SHA"
          echo "Gradle executable:"
          command -v gradle

          VERSION_OUTPUT="$(gradle --version)"
          printf '%s\n' "$VERSION_OUTPUT"

          if ! grep -Fxq 'Gradle 9.6.0' <<< "$VERSION_OUTPUT"; then
            echo "::error::Expected Gradle 9.6.0. Stopping before build."
            exit 1
          fi

      - name: Repair unsupported_message string
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          res_dir = Path("app/src/main/res")
          safe_string = (
              '<string name="unsupported_message">'
              'This feature is not supported on this device.'
              '</string>'
          )

          pattern = re.compile(
              r'<string\b'
              r'(?=[^>]*\bname\s*=\s*["\']unsupported_message["\'])'
              r'[^>]*(?:/\s*>|>.*?</string\s*>)',
              re.DOTALL,
          )

          default_found = False

          for folder in sorted(res_dir.glob("values*")):
              if not folder.is_dir():
                  continue

              for path in sorted(folder.glob("*.xml")):
                  original = path.read_text(encoding="utf-8")
                  updated, count = pattern.subn(
                      lambda match: safe_string,
                      original,
                  )

                  if count:
                      path.write_text(updated, encoding="utf-8")
                      print(f"Repaired {count} entry/entries in {path}")

                      if folder.name == "values":
                          default_found = True

          if not default_found:
              values_dir = res_dir / "values"
              values_dir.mkdir(parents=True, exist_ok=True)

              override = values_dir / "muse_unsupported_message_override.xml"

              if override.exists():
                  raise SystemExit(
                      f"Refusing to overwrite existing file: {override}"
                  )

              override.write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<resources>\n'
                  f'    {safe_string}\n'
                  '</resources>\n',
                  encoding="utf-8",
              )
              print(f"Created app-level override: {override}")
          PY

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: muse-number-three-debug
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode signing keystore
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > app/release.keystore

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          MUSE3_KEYSTORE: ${{ steps.project.outputs.dir }}/app/release.keystore
          MUSE3_KEYSTORE_PASS: ${{ secrets.MUSE3_KEYSTORE_PASS }}
          MUSE3_KEY_ALIAS: ${{ secrets.MUSE3_KEY_ALIAS }}
          MUSE3_KEY_PASS: ${{ secrets.MUSE3_KEY_PASS }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Create draft GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/release/app-release.apk

      - name: Remove keystore
        if: always() && steps.project.outputs.dir != ''
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        shell: bash
        run: rm -f "$PROJECT_DIR/app/release.keystore"
