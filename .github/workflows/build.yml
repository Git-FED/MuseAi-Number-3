name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 35
        run: sdkmanager "platforms;android-35"

      - name: Verify Gradle wrapper
        run: |
          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.jar
          test -f ./gradle/wrapper/gradle-wrapper.properties

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Update app compileSdk to 35
        shell: python
        run: |
          import pathlib
          import re

          candidates = [
              pathlib.Path("app/build.gradle.kts"),
              pathlib.Path("app/build.gradle"),
          ]

          build_file = next((path for path in candidates if path.is_file()), None)
          if build_file is None:
              raise SystemExit("Could not find the app module Gradle build file.")

          content = build_file.read_text()
          pattern = re.compile(
              r"(?m)^(\s*(?:compileSdk|compileSdkVersion)\s*(?:=\s*|\(\s*)?)(\d+)"
          )

          def update_sdk(match):
              return match.group(1) + str(max(35, int(match.group(2))))

          updated, count = pattern.subn(update_sdk, content)

          if count == 0:
              raise SystemExit(
                  "No numeric compileSdk declaration found. Update the shared "
                  "configuration or version catalog to compileSdk 35 or later."
              )

          build_file.write_text(updated)

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: muse-number-three-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode signing keystore
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MUSE3_KEYSTORE: ${{ github.workspace }}/app/release.keystore
          MUSE3_KEYSTORE_PASS: ${{ secrets.MUSE3_KEYSTORE_PASS }}
          MUSE3_KEY_ALIAS: ${{ secrets.MUSE3_KEY_ALIAS }}
          MUSE3_KEY_PASS: ${{ secrets.MUSE3_KEY_PASS }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Create draft GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true

      - name: Remove keystore
        if: always()
        run: rm -f app/release.keystore
