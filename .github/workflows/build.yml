name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35'

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.jar
          test -f ./gradle/wrapper/gradle-wrapper.properties

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Ensure app compileSdk is at least 35
        shell: python
        run: |
          import pathlib
          import re

          candidates = [
              pathlib.Path("app/build.gradle.kts"),
              pathlib.Path("app/build.gradle"),
          ]

          build_file = next(
              (path for path in candidates if path.is_file()),
              None,
          )

          if build_file is None:
              raise SystemExit(
                  "Could not find app/build.gradle.kts or app/build.gradle."
              )

          content = build_file.read_text()

          pattern = re.compile(
              r"(?m)^([ \t]*(?:compileSdk|compileSdkVersion)"
              r"[ \t]*(?:=[ \t]*|\([ \t]*)?)(\d+)\b"
          )

          def update_sdk(match):
              sdk = max(35, int(match.group(2)))
              return match.group(1) + str(sdk)

          updated, count = pattern.subn(update_sdk, content)

          if count == 0:
              raise SystemExit(
                  "No numeric compileSdk declaration found. Set compileSdk "
                  "to 35 or later in your shared Gradle configuration."
              )

          build_file.write_text(updated)

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: muse-number-three-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode signing keystore
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > app/release.keystore

          test -s app/release.keystore

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MUSE3_KEYSTORE: ${{ github.workspace }}/app/release.keystore
          MUSE3_KEYSTORE_PASS: ${{ secrets.MUSE3_KEYSTORE_PASS }}
          MUSE3_KEY_ALIAS: ${{ secrets.MUSE3_KEY_ALIAS }}
          MUSE3_KEY_PASS: ${{ secrets.MUSE3_KEY_PASS }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Create draft GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true

      - name: Remove keystore
        if: always()
        run: rm -f app/release.keystore
