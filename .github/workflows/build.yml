name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Must match the Gradle version required by your Android project.
  GRADLE_VERSION: '8.9'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        id: project
        shell: bash
        run: |
          if [ -f "$GITHUB_WORKSPACE/settings.gradle" ] || \
             [ -f "$GITHUB_WORKSPACE/settings.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            mapfile -t PROJECT_DIRS < <(
              find "$GITHUB_WORKSPACE" \
                -type d -name .git -prune -o \
                -type f \( \
                  -name settings.gradle \
                  -o -name settings.gradle.kts \
                \) -printf '%h\n' | sort -u
            )

            if [ "${#PROJECT_DIRS[@]}" -eq 0 ]; then
              echo "::error::No Gradle settings file found. Upload your complete Android project, not only this workflow."
              echo "Repository files:"
              find "$GITHUB_WORKSPACE" -maxdepth 3 -type f \
                -not -path '*/.git/*'
              exit 1
            fi

            if [ "${#PROJECT_DIRS[@]}" -gt 1 ]; then
              echo "::error::Multiple Gradle projects found. The Android project directory must be selected explicitly."
              printf '%s\n' "${PROJECT_DIRS[@]}"
              exit 1
            fi

            PROJECT_DIR="${PROJECT_DIRS[0]}"
          fi

          echo "Android project: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: muse-number-three-debug
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode signing keystore
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > app/release.keystore

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          MUSE3_KEYSTORE: ${{ steps.project.outputs.dir }}/app/release.keystore
          MUSE3_KEYSTORE_PASS: ${{ secrets.MUSE3_KEYSTORE_PASS }}
          MUSE3_KEY_ALIAS: ${{ secrets.MUSE3_KEY_ALIAS }}
          MUSE3_KEY_PASS: ${{ secrets.MUSE3_KEY_PASS }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Create draft GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/release/app-release.apk

      - name: Remove keystore
        if: always() && steps.project.outputs.dir != ''
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: rm -f "$PROJECT_DIR/app/release.keystore"
